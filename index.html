<body>
<div class="wrap">
  <div class="topbar">
    <div>
      <h1 class="title">2026定价表</h1>
      <div class="save-state" id="saveState">已自动保存</div>
    </div>
    <div class="actions">
      <button class="btn" id="btnTpl">⬇ 下载导入模板</button>
      <button class="btn" id="btnImport">⬆ 导入 Excel</button>
      <button class="btn" id="btnExport">⬇ 导出 Excel</button>
      <button class="btn primary" id="btnAddGroup">＋ 添加商品分组</button>
      <input type="file" id="fileImport" accept=".xlsx,.xls" style="display:none">
    </div>
  </div>

  <div class="toolbar">
    <div class="toolbar-left">
      <label class="tb-label" id="chkAllWrap" style="display:none"><input type="checkbox" id="chkAllVisible"> 全选</label>

    </div>
    <div class="search-box">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="搜索分组名称…">
      <button class="search-clear" id="searchClear" style="display:none" title="清空">✕</button>
    </div>
  </div>

  <div id="groups"></div>

  <div class="empty-state" id="emptyState" style="display:none">
    还没有任何数据。可先「下载导入模板」按格式填写后导入,或直接手动添加。
    <br><button class="btn primary" id="btnAddGroup2">＋ 添加商品分组</button>
  </div>

  <div class="no-match" id="noMatch" style="display:none">
    没有找到名称包含「<span id="noMatchKw"></span>」的分组。
  </div>
</div>

<div class="modal-mask" id="delModal">
  <div class="modal-box">
    <div class="modal-title">删除分组</div>

    <div class="modal-actions">
      <button class="btn ghost" id="delModalCancel" type="button">取消</button>
      <button class="btn danger solid" id="delModalConfirm" type="button">确认删除</button>
    </div>
  </div>
</div>

<script>
(function(){
  'use strict';
  var STORE_KEY = 'sku-discount-calc-table-v2';
  var DEFAULT_TIERS = [[698,50],[498,30],[298,20],[198,10],[118,5],[68,3]];
  var DEFAULT_SUP_PCT = 15, DEFAULT_GUO_PCT = 15;

  // 综合成本默认值(新建 SKU 预填);添加一行时优先继承同组上一行
  var DEFAULT_COST = {fixedCost:7.42, wagePct:8.34, taxPct:8, commPct:6.5, shipVal:3.89, shipMode:'yuan'};
  var COST_FIELDS = ['fixedCost','wagePct','taxPct','commPct','shipVal','shipMode'];
  function costDefaults(){
    var c = {}; COST_FIELDS.forEach(function(k){ c[k] = DEFAULT_COST[k]; }); return c;
  }
  // 取某 SKU 生效的综合成本(用于继承):该行填了就用该行,否则回退默认
  function costOf(sku){
    var c = costDefaults();
    COST_FIELDS.forEach(function(k){
      if(sku && sku[k]!=null && sku[k]!=='') c[k] = sku[k];
    });
    return c;
  }
  // 综合成本/退款率按分组统一:以每组第一行为准,同步到该组所有 SKU
  function syncGroupCost(g){
    if(!g || !g.skus || !g.skus.length) return;
    var base = costOf(g.skus[0]);
    var f0 = g.skus[0];
    var firstRefund = (f0.refundPct!=null && f0.refundPct!=='') ? f0.refundPct : null;
    g.skus.forEach(function(sk){
      COST_FIELDS.forEach(function(k){ sk[k] = base[k]; });
      sk.refundPct = firstRefund;
    });
  }

  /* ---------------- 计算核心(金额单位:分) ---------------- */
  // 取分组参数(带默认值):{hasG, supPct, guoPct, tiers}
  function groupParams(g){
    var supPct = (g.supPct!=null && g.supPct!=='' && isFinite(Number(g.supPct))) ? Number(g.supPct) : DEFAULT_SUP_PCT;
    var guoPct = (g.guoPct!=null && g.guoPct!=='' && isFinite(Number(g.guoPct))) ? Number(g.guoPct) : DEFAULT_GUO_PCT;
    var tiers = null;
    if(Array.isArray(g.tiers) && g.tiers.length){
      tiers = g.tiers.map(function(t){ return [Number(t[0]), Number(t[1])]; })
                     .filter(function(t){ return isFinite(t[0]) && t[0]>0 && isFinite(t[1]) && t[1]>=0; });
    }
    if(!tiers || !tiers.length) tiers = DEFAULT_TIERS.map(function(t){return t.slice();});
    tiers.sort(function(a,b){ return b[0]-a[0]; });
    return {hasG: g.guobu!==false, supPct:supPct, guoPct:guoPct, tiers:tiers};
  }
  function couponCents(saleCents, tiers){
    for(var i=0;i<tiers.length;i++){ if(saleCents >= tiers[i][0]*100) return tiers[i][1]*100; }
    return 0;
  }
  function tierLabel(S, tiers){
    for(var i=0;i<tiers.length;i++){ if(S >= tiers[i][0]) return '满'+tiers[i][0]+'减'+tiers[i][1]; }
    return '未达券门槛';
  }
  // 超级立减:入参售价(元)、立减比例(%),返回 {raw, val, rule}
  function superCents(S, supPct){
    var rate = (supPct==null ? DEFAULT_SUP_PCT : supPct)/100;
    var saleCents = Math.round(S*100);
    var raw = Math.round(saleCents*rate);
    if(S > 100) return {raw:raw, val:Math.ceil(raw/100)*100, rule:'进位到元'};
    if(S > 10)  return {raw:raw, val:Math.ceil(raw/10)*10,    rule:'进位到角'};
    return {raw:raw, val:raw, rule:'保留分'};
  }
  // 正算:入参一口价(可为小数),内部先截断取整;p=groupParams(g)
  function forward(lpRaw, p){
    p = p || groupParams({});
    var lp = Math.floor(Math.max(0, Number(lpRaw)||0));
    var saleCents = lp*50, S = saleCents/100;
    var sup = superCents(S, p.supPct);
    var c = couponCents(saleCents, p.tiers);
    var guo = p.hasG ? Math.round((saleCents - sup.val - c)*p.guoPct/100) : 0;
    var fin = saleCents - sup.val - c - guo;
    return {lp:lp, S:S, saleCents:saleCents, supVal:sup.val, supRaw:sup.raw, rule:sup.rule,
            c:c, cLabel:tierLabel(S, p.tiers), guo:guo, hasGuoBu:p.hasG,
            supPct:p.supPct, guoPct:p.guoPct, fin:fin, zhe: lp>0 ? fin/lp/10 : 0};
  }
  // 反推:目标到手价 → 连续一口价(保留小数)+ 截断取整值
  function reverse(targetYuan, p){
    p = p || groupParams({});
    var T = Math.max(0, Number(targetYuan)||0);
    var div = p.hasG ? (1 - p.guoPct/100) : 1;   // 有国补:到手=(售价-立减-券)×(1-国补率);无国补:到手=售价-立减-券
    var cOptsMap = {0:1};
    p.tiers.forEach(function(t){ cOptsMap[t[1]] = 1; });
    var cOpts = Object.keys(cOptsMap).map(Number).sort(function(a,b){return a-b;});
    var best = null;
    for(var k=0;k<cOpts.length;k++){
      var C = cOpts[k], S = T/div + C;
      for(var i=0;i<25;i++){
        var sup = superCents(S, p.supPct);
        var Snew = T/div + sup.val/100 + C;
        if(Math.abs(Snew-S) < 1e-7){ S = Snew; break; }
        S = Snew;
      }
      var sup2 = superCents(S, p.supPct);
      var saleCents = Math.round(S*100);
      var realC = couponCents(saleCents, p.tiers);
      var guo = p.hasG ? Math.round((saleCents - sup2.val - realC)*p.guoPct/100) : 0;
      var fin = saleCents - sup2.val - realC - guo;
      var d = fin/100 - T;
      var score = Math.abs(d) + (d<=0 ? 0 : 0.5);
      if(!best || score < best.score) best = {S:S, score:score};
    }
    var lpCont = best.S*2;
    lpCont = Math.round(lpCont*100)/100;
    var lpInt = Math.floor(lpCont);
    return {lpCont:lpCont, lpInt:lpInt, f:forward(lpInt, p)};
  }
  function fmt(cents){ return (cents/100).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function fmt2(yuan){ return (yuan).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2}); }

  function debounce(fn, ms){ var t; return function(){ var a=arguments,th=this; clearTimeout(t); t=setTimeout(function(){ fn.apply(th,a); }, ms); }; }

  groups.forEach(function(g){

    });
    var addRow = document.createElement('button');
    addRow.className = 'btn sm primary'; addRow.textContent = '＋ 添加一行';
    addRow.addEventListener('click', function(){
      var first = g.skus.length ? g.skus[0] : null;   // 继承同组第一行的综合成本/退款率
      var sku = Object.assign({id:uid(), name:'SKU '+(g.skus.length+1), lp:null, target:null,
        refundPct:(first && first.refundPct!=null && first.refundPct!=='') ? first.refundPct : null}, costOf(first));
      g.skus.push(sku);
      g.collapsed = false;   // 添加行后自动展开,便于看到新行
      renderAll();
    });
    var hideG = document.createElement('button');
    hideG.className = 'btn sm ghost';
    hideG.textContent = g.hidden ? '显示' : '隐藏';
    hideG.title = g.hidden ? '取消隐藏,恢复该分组正常显示' : '隐藏该分组(数据保留,可点"查看已隐藏"找回)';
    hideG.addEventListener('click', function(){ g.hidden = !g.hidden; g.sel = false; renderAll(); });
    var delG = document.createElement('button');
    delG.className = 'btn sm danger ghost'; delG.textContent = '删除分组';
    delG.addEventListener('click', function(){
      // 先弹出确认框,点击"确认删除"后才真正删除
      pendingDeleteId = g.id;
      delModalName.textContent = g.name;
      document.getElementById('delModal').classList.add('show');
    });
    head.appendChild(selChk); head.appendChild(toggle); head.appendChild(name); head.appendChild(badge); head.appendChild(seg); head.appendChild(btnParams); head.appendChild(spacer);
    head.appendChild(gExp); head.appendChild(gImp); head.appendChild(gFile); head.appendChild(addRow); head.appendChild(hideG); head.appendChild(delG);
    box.appendChild(head);
    box.appendChild(paramsBox);

    // 参数变化时只重算各行数值,不重建 DOM(避免输入失焦)
    function refreshRows(){
      Array.prototype.forEach.call(tbody.querySelectorAll('tr'), function(tr){
        if(typeof tr._refresh === 'function') tr._refresh();
      });
    }

    var scroll = document.createElement('div');
    scroll.className = 'table-scroll';
    var table = document.createElement('table');
    table.innerHTML =
      '<thead><tr>' +
      '<th style="text-align:left">SKU 名称</th>' +
      '<th class="tg">目标到手价(元)</th>' +
      '<th>售价</th>' +
      '<th>一口价(元)</th>' +
      '<th>到手价</th>' +
      '<th class="intcol">取整一口价</th>' +
      '<th>成本(元)</th><th title="基数=商家到手=售价−立减−券(有国补时=到手价+国补,无国补时=到手价);毛利率=(商家到手−成本)÷商家到手">毛利率</th>' +
      '<th title="退款率(可调)">退款率</th><th title="净毛利率 = 毛利率 − 国补÷商家到手(仅有国补) − 退款率 − 固定成本÷商家到手 − 工资 − 税点 − 佣金/服务费 − 运费(元÷商家到手、%按点数);商家到手=售价−立减−券,无国补时国补项为0">净毛利率</th>' +
      '<th style="text-align:center">优惠明细</th><th style="text-align:center">综合成本</th><th></th>' +
      '</tr></thead>';
    var tbody = document.createElement('tbody');
    if(!g.skus.length){
      var tr = document.createElement('tr');
      tr.innerHTML = '<td colspan="13" class="empty-row">该分组还没有数据,点「＋ 添加一行」或导入 Excel。</td>';
      tbody.appendChild(tr);
    }
    var rowRefreshes = [];
    g.skus.forEach(function(s, idx){
      var rows = buildRow(g, s, idx===0, function(){ rowRefreshes.forEach(function(fn){ fn(); }); });
      if(idx % 2 === 1) rows.main.classList.add('zebra');
      tbody.appendChild(rows.main); tbody.appendChild(rows.detail); tbody.appendChild(rows.costrow);
      rowRefreshes.push(rows.main._refresh);
    });
    table.appendChild(tbody);
    scroll.appendChild(table);
    box.appendChild(scroll);
    applyCollapsed();   // 应用折叠状态(搜索时强制展开)
    return box;
  }

  function buildRow(g, s, isFirst, onCostChange){
    isFirst = isFirst !== false;
    onCostChange = onCostChange || function(){};
    // 综合成本按分组统一:写第一行即同步整组
    function setCost(key, val){
      g.skus.forEach(function(sk){ sk[key] = val; });
      save(); onCostChange();
    }
    var tr = document.createElement('tr');

    var tdName = document.createElement('td'); tdName.className = 'c-name';
    var nameIn = document.createElement('input');
    nameIn.className = 'cell-in'; nameIn.value = s.name||''; nameIn.placeholder = 'SKU 名称 / 规格';
    nameIn.addEventListener('input', function(){ s.name = nameIn.value; save(); });
    tdName.appendChild(nameIn);

    var tdLp = document.createElement('td'); tdLp.className = 'c-lp r';
    var lpIn = document.createElement('input');
    lpIn.className = 'cell-in'; lpIn.type = 'number'; lpIn.min = '0'; lpIn.step = '0.01';
    lpIn.value = (s.lp==null?'':s.lp); lpIn.placeholder = '如 1000';
    lpIn.addEventListener('input', function(){
      s.lp = lpIn.value==='' ? null : Math.max(0, Number(lpIn.value)||0);
      // 一口价变化时,取整一口价自动同步为"去小数"值(用户仍可再手动改)
      s.intLp = (s.lp!=null && s.lp>0) ? Math.floor(s.lp) : null;
      save(); refresh();
    });
    tdLp.appendChild(lpIn);

    var tdInt = document.createElement('td'); tdInt.className = 'c-int r';
    var intIn = document.createElement('input');
    intIn.className = 'cell-in'; intIn.type = 'number'; intIn.min = '0'; intIn.step = '1';
    intIn.value = (s.intLp==null?'':s.intLp); intIn.placeholder = '自动';
    intIn.title = '默认=一口价去掉小数,可手动改成整数,优惠按此值计算';
    var intSub = document.createElement('div'); intSub.className = 'intsub';
    intIn.addEventListener('input', function(){
      s.intLp = intIn.value==='' ? null : Math.max(0, Math.floor(Number(intIn.value)||0));
      save(); refresh();
    });
    tdInt.appendChild(intIn); tdInt.appendChild(intSub);

    var tdTg = document.createElement('td'); tdTg.className = 'c-tg r';
    var tgIn = document.createElement('input');
    tgIn.className = 'cell-in'; tgIn.type = 'number'; tgIn.min = '0'; tgIn.step = '0.01';
    tgIn.value = (s.target==null?'':s.target); tgIn.placeholder = '如 335.75';
    tgIn.addEventListener('input', debounce(function(){
      s.target = tgIn.value==='' ? null : Math.max(0, Number(tgIn.value)||0);
      if(s.target!=null && s.target>0){
        var r = reverse(s.target, groupParams(g));
        s.lp = r.lpCont;
        s.intLp = r.lpInt;
        lpIn.value = r.lpCont;
      }
      save(); refresh();
    }, 350));
    tdTg.appendChild(tgIn);

    var tdSale = document.createElement('td'); tdSale.className = 'r';
    var tdFin  = document.createElement('td'); tdFin.className = 'r';

    // 成本(可输入)
    var tdCost = document.createElement('td'); tdCost.className = 'c-cost r';
    var costIn = document.createElement('input');
    costIn.className = 'cell-in'; costIn.type = 'number'; costIn.min = '0'; costIn.step = '0.01';
    costIn.value = (s.cost==null?'':s.cost); costIn.placeholder = '成本';
    costIn.addEventListener('input', function(){
      s.cost = costIn.value==='' ? null : Math.max(0, Number(costIn.value)||0);
      save(); refresh();
    });
    tdCost.appendChild(costIn);

    // 毛利率(自动 =(商家到手−成本)÷商家到手;商家到手=售价−立减−券)
    var tdMargin = document.createElement('td'); tdMargin.className = 'r c-margin';
    tdMargin.title = '毛利率 =(商家到手−成本)÷商家到手;商家到手=售价−立减−券(有国补时=到手价+国补,无国补时=到手价)';

    // 退款率(可调,%;本组以第一行为准,整组同步)
    var tdRefund = document.createElement('td'); tdRefund.className = 'c-refund r';
    var refundWrap = document.createElement('span'); refundWrap.className = 'rwrap';
    var refundIn = document.createElement('input');
    refundIn.className = 'cell-in'; refundIn.type = 'number'; refundIn.min = '0'; refundIn.max = '100'; refundIn.step = '0.01';
    refundIn.value = (s.refundPct==null?'':s.refundPct); refundIn.placeholder = '0';
    refundIn.title = isFirst ? '退款率(%),本组以第一行为准,改这里自动同步整组' : '退款率跟随第一行,如需修改请改第一行';
    if(!isFirst){ refundIn.disabled = true; refundIn.tabIndex = -1; }
    var refundUnit = document.createElement('span'); refundUnit.className = 'runit'; refundUnit.textContent = '%';
    refundIn.addEventListener('input', function(){
      if(!isFirst) return;
      setCost('refundPct', refundIn.value==='' ? null : Math.max(0, Math.min(100, Number(refundIn.value)||0)));
    });
    refundWrap.appendChild(refundIn); refundWrap.appendChild(refundUnit);
    tdRefund.appendChild(refundWrap);

    // 净毛利率(自动)
    var tdNet = document.createElement('td'); tdNet.className = 'r c-net';
    tdNet.title = '净毛利率 = 毛利率 − 国补÷商家到手(仅有国补) − 退款率 − 固定成本÷商家到手 − 工资 − 税点 − 佣金/服务费 − 运费(元÷商家到手、%按点数);商家到手=售价−立减−券(有国补=到手价+国补),无国补时国补项为0';

    // 优惠明细折叠按钮
    var tdDetailBtn = document.createElement('td'); tdDetailBtn.className = 'c-detail';
    var dBtn = document.createElement('button');
    dBtn.type = 'button'; dBtn.className = 'btn-detail';
    dBtn.innerHTML = '优惠明细<span class="caret">▸</span>';
    dBtn.title = '展开/收起 立减·券·国补·折扣 明细';

    // 综合成本折叠按钮
    var tdCostBtn = document.createElement('td'); tdCostBtn.className = 'c-costbtn';
    var cBtn = document.createElement('button');
    cBtn.type = 'button'; cBtn.className = 'btn-detail';
    cBtn.innerHTML = '综合成本<span class="caret">▸</span>';
    cBtn.title = '展开/收起 固定成本·工资·税点·佣金';

    var tdDel  = document.createElement('td'); tdDel.className = 'r';
    var delBtn = document.createElement('button');
    delBtn.className = 'row-del'; delBtn.textContent = '✕'; delBtn.title = '删除此行';
    delBtn.addEventListener('click', function(){
      g.skus = g.skus.filter(function(x){ return x.id!==s.id; });
      renderAll();
    });
    tdDel.appendChild(delBtn);

    // 优惠明细展开行(默认折叠)
    var detailTr = document.createElement('tr'); detailTr.className = 'detail-row';
    var dtd = document.createElement('td'); dtd.colSpan = 13;
    var grid = document.createElement('div'); grid.className = 'detail-grid';
    function makeDItem(label){
      var it = document.createElement('div'); it.className = 'ditem';
      var lb = document.createElement('div'); lb.className = 'dlabel'; lb.textContent = label;
      var vl = document.createElement('div'); vl.className = 'dval';
      var sb = document.createElement('div'); sb.className = 'dsub';
      it.appendChild(lb); it.appendChild(vl); it.appendChild(sb);
      grid.appendChild(it);
      return {vl:vl, sb:sb};
    }
    var dSup = makeDItem('超级立减');
    var dC   = makeDItem('优惠券');
    var dGuo = makeDItem('国补');
    var dZhe = makeDItem('折扣');
    dtd.appendChild(grid); detailTr.appendChild(dtd);
    dBtn.addEventListener('click', function(){
      var open = detailTr.classList.toggle('open');
      dBtn.classList.toggle('on', open);
    });
    tdDetailBtn.appendChild(dBtn);

    // 综合成本展开行(默认折叠):固定成本(元)/工资(%)/税点(%)/佣金服务费(%)
    var costTr = document.createElement('tr'); costTr.className = 'detail-row';
    var ctd = document.createElement('td'); ctd.colSpan = 13;
    var cgrid = document.createElement('div'); cgrid.className = 'detail-grid';
    var costInp = {};
    function makeCostItem(label, unit, key, step){
      var it = document.createElement('div'); it.className = 'ditem cost-edit';
      var lb = document.createElement('div'); lb.className = 'dlabel'; lb.textContent = label;
      var wrap = document.createElement('div'); wrap.className = 'dwrap';
      var inp = document.createElement('input');
      inp.type = 'number'; inp.min = '0'; inp.step = step||'0.01';
      inp.value = (s[key]==null?'':s[key]); inp.placeholder = '0';
      if(!isFirst){ inp.disabled = true; inp.tabIndex = -1; }
      var un = document.createElement('span'); un.className = 'dunit'; un.textContent = unit;
      inp.addEventListener('input', function(){
        setCost(key, inp.value==='' ? null : Math.max(0, Number(inp.value)||0));
      });
      wrap.appendChild(inp); wrap.appendChild(un);
      it.appendChild(lb); it.appendChild(wrap);
      cgrid.appendChild(it);
      costInp[key] = inp;
      return inp;
    }
    makeCostItem('固定成本', '元', 'fixedCost', '0.01');
    makeCostItem('工资', '%', 'wagePct', '0.01');
    makeCostItem('税点', '%', 'taxPct', '0.01');
    makeCostItem('佣金/服务费', '%', 'commPct', '0.01');
    // 运费:可切换 固定金额(元) / 百分比(%)
    (function(){
      var it = document.createElement('div'); it.className = 'ditem cost-edit';
      var lb = document.createElement('div'); lb.className = 'dlabel'; lb.textContent = '运费';
      var wrap = document.createElement('div'); wrap.className = 'dwrap';
      var inp = document.createElement('input');
      inp.type = 'number'; inp.min = '0'; inp.step = '0.01';
      inp.value = (s.shipVal==null?'':s.shipVal); inp.placeholder = '0';
      if(!isFirst){ inp.disabled = true; inp.tabIndex = -1; }
      var tg = document.createElement('span'); tg.className = 'unit-toggle';
      var bY = document.createElement('button'); bY.type = 'button'; bY.textContent = '元';
      var bP = document.createElement('button'); bP.type = 'button'; bP.textContent = '%';
      if(!isFirst){ bY.disabled = true; bP.disabled = true; }
      function syncMode(){
        var mode = s.shipMode==='pct' ? 'pct' : 'yuan';
        bY.classList.toggle('on', mode==='yuan');
        bP.classList.toggle('on', mode==='pct');
      }
      bY.addEventListener('click', function(){ if(!isFirst) return; setCost('shipMode','yuan'); syncMode(); });
      bP.addEventListener('click', function(){ if(!isFirst) return; setCost('shipMode','pct');  syncMode(); });
      inp.addEventListener('input', function(){
        setCost('shipVal', inp.value==='' ? null : Math.max(0, Number(inp.value)||0));
      });
      syncMode();
      tg.appendChild(bY); tg.appendChild(bP);
      wrap.appendChild(inp); wrap.appendChild(tg);
      it.appendChild(lb); it.appendChild(wrap);
      cgrid.appendChild(it);
      costInp.shipVal = inp; costInp.shipModeSync = syncMode;
    })();
    // 打开面板时把当前(组内同步的)值刷新到输入框
    function syncCostPanel(){
      ['fixedCost','wagePct','taxPct','commPct','shipVal'].forEach(function(k){
        if(costInp[k]) costInp[k].value = (s[k]==null?'':s[k]);
      });
      if(costInp.shipModeSync) costInp.shipModeSync();
    }
    var cnote = document.createElement('div');
    cnote.style.cssText = 'width:100%;font:500 11px var(--font-sans);color:var(--text-muted);margin-top:2px;';
    cnote.textContent = isFirst
      ? '本组综合成本以第一行为准,改这里会自动同步到本组所有 SKU。工资/税点/佣金/运费(%)按百分点扣减,固定成本与运费(元)按金额÷商家到手扣减;商家到手=售价−立减−券(有国补=到手价+国补、无国补=到手价)。净毛利率=毛利率−国补÷商家到手(仅有国补)−退款率−以上各项,无国补时国补项为0。'
      : '本组综合成本跟随第一行自动同步,如需修改请改第一行。';
    cgrid.appendChild(cnote);
    ctd.appendChild(cgrid); costTr.appendChild(ctd);
    cBtn.addEventListener('click', function(){
      var open = costTr.classList.toggle('open');
      cBtn.classList.toggle('on', open);
      if(open) syncCostPanel();   // 展开时刷新为组内最新(第一行)值
    });
    tdCostBtn.appendChild(cBtn);

    tr.appendChild(tdName); tr.appendChild(tdTg); tr.appendChild(tdSale);
    tr.appendChild(tdLp); tr.appendChild(tdFin); tr.appendChild(tdInt);
    tr.appendChild(tdCost); tr.appendChild(tdMargin); tr.appendChild(tdRefund); tr.appendChild(tdNet);
    tr.appendChild(tdDetailBtn); tr.appendChild(tdCostBtn); tr.appendChild(tdDel);

    function refresh(){
      // 非首行退款率跟随第一行同步显示(首行不重置,保留正在输入的内容)
      if(!isFirst){ refundIn.value = (s.refundPct==null?'':s.refundPct); }
      var lpNum  = (s.lp!=null && s.lp!=='') ? Number(s.lp) : null;
      var intNum = (s.intLp!=null && s.intLp!=='' && Number(s.intLp)>0) ? Math.floor(Number(s.intLp)) : null;
      // 生效取整价:手填取整价优先;否则一口价去小数;都没有则留空
      var autoInt = (lpNum!=null && lpNum>0) ? Math.floor(lpNum) : null;
      var eff = intNum!=null ? intNum : autoInt;
      if(document.activeElement!==intIn){ intIn.value = (eff!=null ? eff : ''); }
      var f = eff!=null ? forward(eff, groupParams(g)) : null;
      if(!f){
        intSub.textContent = ''; intSub.classList.remove('manual');
        tdSale.innerHTML='<span style="color:var(--text-muted)">—</span>';
        tdFin.innerHTML='<span style="color:var(--text-muted)">—</span>';
        tdMargin.innerHTML='<span style="color:var(--text-muted)">—</span>';
        tdNet.innerHTML='<span style="color:var(--text-muted)">—</span>';
        [dSup,dC,dGuo,dZhe].forEach(function(d){ d.vl.textContent='—'; d.sb.textContent=''; });
        return;
      }
      // 取整列下方提示
      intSub.classList.remove('manual');
      if(intNum!=null && autoInt!=null && intNum!==autoInt){
        intSub.textContent = '已手动改 · 自动值为 '+autoInt;
        intSub.classList.add('manual');
      } else if(intNum!=null && autoInt==null){
        intSub.textContent = '手动填写';
        intSub.classList.add('manual');
      } else if(lpNum!=null && lpNum!==f.lp){
        intSub.textContent = '原值 ' + fmt2(lpNum) + ' · 去小数';
      } else {
        intSub.textContent = '';
      }
      tdSale.textContent = fmt(f.saleCents);
      // 明细四项
      dSup.vl.textContent = '−'+fmt(f.supVal);
      dSup.sb.textContent = '售价×'+f.supPct+'% · '+f.rule+(f.supVal!==f.supRaw?'(原值'+fmt(f.supRaw)+')':'');
      dC.vl.textContent = '−'+fmt(f.c);
      dC.sb.textContent = f.cLabel;
      if(f.hasGuoBu){
        dGuo.vl.textContent = '−'+fmt(f.guo);
        dGuo.sb.textContent = '(售价−立减−券)×'+f.guoPct+'%';
      } else {
        dGuo.vl.textContent = '—';
        dGuo.sb.textContent = '无国补';
      }
      dZhe.vl.textContent = f.zhe.toFixed(2)+' 折';
      dZhe.sb.textContent = '到手价 ÷ 一口价';
      // 到手价
      var diffHtml = '';
      if(s.target!=null && s.target>0){
        var d = f.fin/100 - s.target;
        diffHtml = '<div class="sub diff">目标 '+fmt2(s.target)+' · '+(d>=0?'+':'')+d.toFixed(2)+'</div>';
      }
      tdFin.innerHTML  = '<span class="fin">'+fmt(f.fin)+'</span>' + diffHtml;
      // 毛利/净毛利基数 = 商家实际到手 = 售价−立减−券(有国补时=到手价+国补;无国补时=到手价)
      var baseY = (f.fin + f.guo)/100;
      // 毛利率 = (商家到手 − 成本) ÷ 商家到手
      var gross = (s.cost!=null && s.cost!=='') ? (baseY - s.cost)/baseY : null;
      if(gross!=null){
        tdMargin.innerHTML = '<span class="mval">'+(gross*100).toFixed(2)+'%</span>';
      } else {
        tdMargin.innerHTML = '<span style="color:var(--text-muted)">—</span>';
      }
      // 净毛利率 = 毛利率 − 国补÷商家到手(仅有国补) − 退款率% − 固定成本÷商家到手 − 工资% − 税点% − 佣金% − 运费
      //   注:毛利率基数=商家到手(售价−立减−券,含国补);净毛利再把国补扣回。无国补时 f.guo=0,此项为0、结果不变。
      if(gross!=null){
        var net = gross;
        net -= (f.guo/100)/baseY;                 // 国补占比 = 国补 ÷ 商家到手(无国补时为0)
        if(s.refundPct!=null && s.refundPct!=='') net -= s.refundPct/100;
        if(s.fixedCost!=null && s.fixedCost!=='') net -= s.fixedCost/baseY;
        if(s.wagePct!=null && s.wagePct!=='') net -= s.wagePct/100;
        if(s.taxPct!=null && s.taxPct!=='') net -= s.taxPct/100;
        if(s.commPct!=null && s.commPct!=='') net -= s.commPct/100;
        if(s.shipVal!=null && s.shipVal!==''){
          if(s.shipMode==='pct') net -= s.shipVal/100; else net -= s.shipVal/baseY;  // 运费:%按比例,元按金额÷商家到手
        }
        var netPct = net*100;
        tdNet.innerHTML = '<span class="nval'+(netPct<0?' neg':'')+'">'+netPct.toFixed(2)+'%</span>';
      } else {
        tdNet.innerHTML = '<span style="color:var(--text-muted)">—</span>';
      }
    }
    refresh();
    tr._refresh = refresh;
    return {main:tr, detail:detailTr, costrow:costTr};
  }

  /* ---------------- Excel 导入 / 导出 / 模板 ---------------- */
  var HEADERS = ['商品分组','SKU名称','目标到手价(元)','售价(自动)','一口价(元)','到手价(自动)','取整一口价(可手填)','成本(元)','毛利率(自动)','超级立减(自动)','优惠券(自动)','国补(自动)','折扣(自动)','国补方式(有/无)','立减%(默认15)','国补%(默认15)','券档位(选填)','退款率(%)','净毛利率(自动)','固定成本(元)','工资(%)','税点(%)','佣金/服务费(%)','运费','运费方式(元/%)'];

  function tiersToText(tiers){
    return tiers.slice().sort(function(a,b){return a[0]-b[0];}).map(function(t){ return t[0]+'减'+t[1]; }).join('/');
  }
  // 解析券档位文本,如 "68减3/118减5;满198减10" → [[68,3],[118,5],[198,10]]
  function parseTiersText(text){
    if(!text) return null;
    var out = [];
    String(text).split(/[\/;；,，\n]/).forEach(function(part){
      var nums = part.match(/\d+(\.\d+)?/g);
      if(nums && nums.length>=2){
        var min = parseFloat(nums[0]), off = parseFloat(nums[1]);
        if(isFinite(min) && min>0 && isFinite(off) && off>=0) out.push([min, off]);
      }
    });
    return out.length ? out : null;
  }

  function collectRows(gs){
    var rows = [];
    (gs||groups).forEach(function(g){
      var pp = groupParams(g);
      g.skus.forEach(function(s){
        var hasLp = (s.lp!=null && s.lp!=='' && Number(s.lp)>0);
        var f = hasLp ? forward(s.lp, pp) : null;
        var baseY = f ? (f.fin + f.guo)/100 : null;   // 商家到手 = 售价−立减−券(无国补时=到手价)
        var gross = (f && s.cost!=null && s.cost!=='') ? (baseY - s.cost)/baseY : null;
        var net = null;
        if(gross!=null){
          net = gross;
          net -= (f.guo/100)/baseY;   // 国补占比(有国补时扣;无国补 f.guo=0,不影响)
          if(s.refundPct!=null && s.refundPct!=='') net -= s.refundPct/100;
          if(s.fixedCost!=null && s.fixedCost!=='') net -= s.fixedCost/baseY;
          if(s.wagePct!=null && s.wagePct!=='') net -= s.wagePct/100;
          if(s.taxPct!=null && s.taxPct!=='') net -= s.taxPct/100;
          if(s.commPct!=null && s.commPct!=='') net -= s.commPct/100;
          if(s.shipVal!=null && s.shipVal!==''){
            if(s.shipMode==='pct') net -= s.shipVal/100; else net -= s.shipVal/baseY;
          }
        }
        rows.push({
          grp:g.name, name:s.name||'',
          lp:(s.lp==null?'':s.lp), intp:f?f.lp:'', tg:(s.target==null?'':s.target),
          sale:f?(f.saleCents/100):'', sup:f?(f.supVal/100):'', c:f?(f.c/100):'',
          guo:f?(f.guo/100):'', fin:f?(f.fin/100):'', zhe:f?f.zhe.toFixed(2)+'折':'',
          cost:(s.cost==null?'':s.cost),
          margin:(gross!=null) ? (gross*100).toFixed(2)+'%' : '',
          mode:pp.hasG?'有':'无',
          supPct:pp.supPct, guoPct:pp.guoPct, tiersText:tiersToText(pp.tiers),
          refundPct:(s.refundPct==null?'':s.refundPct),
          netMargin:(net!=null) ? (net*100).toFixed(2)+'%' : '',
          fixedCost:(s.fixedCost==null?'':s.fixedCost),
          wagePct:(s.wagePct==null?'':s.wagePct),
          taxPct:(s.taxPct==null?'':s.taxPct),
          commPct:(s.commPct==null?'':s.commPct),
          shipVal:(s.shipVal==null?'':s.shipVal),
          shipMode:(s.shipMode==='pct'?'%':'元')
        });
      });
    });
    return rows;
  }

  function exportGroupsXlsx(gs, filename){
    if(typeof XLSX === 'undefined'){ alert('Excel 组件未加载,请检查网络后刷新。'); return; }
    var aoa = [HEADERS];
    collectRows(gs).forEach(function(r){
      aoa.push([r.grp,r.name,r.tg,r.sale,r.lp,r.fin,r.intp,r.cost,r.margin,r.sup,r.c,r.guo,r.zhe,r.mode,r.supPct,r.guoPct,r.tiersText,r.refundPct,r.netMargin,r.fixedCost,r.wagePct,r.taxPct,r.commPct,r.shipVal,r.shipMode]);
    });
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{wch:14},{wch:22},{wch:17},{wch:11},{wch:13},{wch:12},{wch:15},{wch:11},{wch:11},{wch:13},{wch:11},{wch:11},{wch:10},{wch:13},{wch:12},{wch:12},{wch:30},{wch:11},{wch:12},{wch:12},{wch:10},{wch:10},{wch:13},{wch:10},{wch:13}];
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'SKU优惠计算');
    XLSX.writeFile(wb, filename);
  }

    exportGroupsXlsx(groups, 'SKU优惠计算_' + new Date().toISOString().slice(0,10) + '.xlsx');
  });

  function parseWorkbookGroups(wb){
    var ws = wb.Sheets[wb.SheetNames[0]];
    var aoa = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
        var hi = -1, col = {};
        for(var i=0;i<aoa.length && hi<0;i++){
          aoa[i].forEach(function(cell, j){
            var t = String(cell||'');
            if(t.indexOf('分组')>=0) col.grp = j;
            else if(t.indexOf('运费方式')>=0 || t.indexOf('运费单位')>=0) col.shipModeCol = j;
            else if(t.indexOf('国补方式')>=0) col.mode = j;
            else if(t.indexOf('方式')>=0 && t.indexOf('运费')<0) col.mode = j;
            else if(t.indexOf('券档')>=0 || t.indexOf('档位')>=0) col.tiers = j;
            else if(t.indexOf('立减%')>=0 || t.indexOf('立减比例')>=0) col.supPct = j;
            else if(t.indexOf('国补%')>=0 || t.indexOf('国补比例')>=0) col.guoPct = j;
            else if(t.indexOf('取整')>=0) col.intp = j;
            else if(t.indexOf('一口价')>=0) col.lp = j;
            else if(t.indexOf('固定成本')>=0) col.fixed = j;
            else if(t.indexOf('成本')>=0) col.cost = j;
            else if(t.indexOf('退款')>=0) col.refund = j;
            else if(t.indexOf('工资')>=0) col.wage = j;
            else if(t.indexOf('税点')>=0 || t.indexOf('税')>=0) col.tax = j;
            else if(t.indexOf('佣金')>=0 || t.indexOf('服务费')>=0) col.comm = j;
            else if(t.indexOf('运费')>=0) col.ship = j;
            else if(t.indexOf('目标')>=0) col.tg = j;
            else if(t.indexOf('SKU')>=0 || t.indexOf('名称')>=0) col.name = j;
          });
          if(col.lp!=null || col.name!=null) hi = i;
        }
        if(hi < 0) return null;
        var ng = [], gmap = {}, lastGrp = '未分组';
        for(var r2=hi+1; r2<aoa.length; r2++){
          var row = aoa[r2]; if(!row) continue;
          var gname = col.grp!=null ? String(row[col.grp]!=null?row[col.grp]:'').trim() : '';
          if(gname) lastGrp = gname;
          var nm = col.name!=null ? String(row[col.name]!=null?row[col.name]:'').trim() : '';
          var lpv = col.lp!=null ? parseFloat(row[col.lp]) : NaN;
          var tgv = col.tg!=null ? parseFloat(row[col.tg]) : NaN;
          var inv = col.intp!=null ? parseFloat(row[col.intp]) : NaN;
          var modev = col.mode!=null ? String(row[col.mode]!=null?row[col.mode]:'').trim() : '';
          var supPctv = col.supPct!=null ? parseFloat(row[col.supPct]) : NaN;
          var guoPctv = col.guoPct!=null ? parseFloat(row[col.guoPct]) : NaN;
          var tiersv = col.tiers!=null ? parseTiersText(row[col.tiers]) : null;
          var hasG = modev.indexOf('无') < 0;   // 含"无"→无国补;空或"有"→有国补
          var lp = isFinite(lpv) && lpv>0 ? lpv : null;
          var tg = isFinite(tgv) && tgv>0 ? tgv : null;
          var intLp = isFinite(inv) && inv>0 ? Math.floor(inv) : null;
          var costv = col.cost!=null ? parseFloat(row[col.cost]) : NaN;
          var cost = isFinite(costv) && costv>0 ? costv : null;
          function numAt(cc){ var v = cc!=null ? parseFloat(row[cc]) : NaN; return (isFinite(v) && v>=0) ? v : null; }
          var fixedCost = numAt(col.fixed), refundPct = numAt(col.refund);
          var wagePct = numAt(col.wage), taxPct = numAt(col.tax), commPct = numAt(col.comm);
          var shipVal = numAt(col.ship);
          var shipModeTxt = col.shipModeCol!=null ? String(row[col.shipModeCol]!=null?row[col.shipModeCol]:'').trim() : '';
          var shipMode = (shipModeTxt.indexOf('%')>=0 || shipModeTxt.indexOf('百分')>=0) ? 'pct' : 'yuan';
          var hasParams = modev || (isFinite(supPctv)&&supPctv>0) || (isFinite(guoPctv)&&guoPctv>0) || tiersv;
          if(!nm && lp==null && tg==null && intLp==null && cost==null && fixedCost==null && refundPct==null && shipVal==null && !hasParams) continue;
          if(!gmap[lastGrp]){
            gmap[lastGrp] = {id:uid(), name:lastGrp, skus:[], guobu:hasG};
            if(isFinite(supPctv)&&supPctv>0) gmap[lastGrp].supPct = supPctv;
            if(isFinite(guoPctv)&&guoPctv>0) gmap[lastGrp].guoPct = guoPctv;
            if(tiersv) gmap[lastGrp].tiers = tiersv;
            ng.push(gmap[lastGrp]);
          } else {
            if(modev) gmap[lastGrp].guobu = hasG;
            if(isFinite(supPctv)&&supPctv>0) gmap[lastGrp].supPct = supPctv;
            if(isFinite(guoPctv)&&guoPctv>0) gmap[lastGrp].guoPct = guoPctv;
            if(tiersv) gmap[lastGrp].tiers = tiersv;
          }
          if(lp==null && tg!=null){
            var rv = reverse(tg, groupParams(gmap[lastGrp]));
            lp = rv.lpCont;
            if(intLp==null) intLp = rv.lpInt;
          }
          gmap[lastGrp].skus.push({id:uid(), name:nm||('SKU '+(gmap[lastGrp].skus.length+1)), lp:lp, intLp:intLp, target:tg, cost:cost,
            fixedCost:fixedCost, refundPct:refundPct, wagePct:wagePct, taxPct:taxPct, commPct:commPct,
            shipVal:shipVal, shipMode:shipVal==null?undefined:shipMode});
        }
    return ng;
  }

  // 读取文件并解析为分组,cb(ng)
  function readGroupsFromFile(file, cb){
    if(typeof XLSX === 'undefined'){ alert('Excel 组件未加载,请检查网络后刷新。'); return; }
    var reader = new FileReader();
    reader.onload = function(e){
      try{ cb(parseWorkbookGroups(XLSX.read(e.target.result, {type:'array'}))); }
      catch(err){ alert('导入失败:' + err.message); }
    };
    reader.readAsArrayBuffer(file);
  }

  document.getElementById('fileImport').addEventListener('change', function(ev){
    var file = ev.target.files[0]; ev.target.value = '';
    if(!file) return;
    readGroupsFromFile(file, function(ng){
      if(!ng || !ng.length){ alert('文件里没有可导入的数据行。'); return; }
      if(confirm('共识别 '+ng.reduce(function(n,g){return n+g.skus.length;},0)+' 个 SKU、'+ng.length+' 个分组。\n导入将'+(groups.length?'替换当前全部数据':'新建数据')+',确定继续?')){
        ng.forEach(function(x){ syncGroupCost(x); x.collapsed = false; });   // 综合成本同步;导入后默认展开便于查看
        groups = ng; renderAll();
      }
    });
  });
  document.getElementById('btnImport').addEventListener('click', function(){
    document.getElementById('fileImport').click();
  });

  /* 浏览器内生成模板(含公式+缓存值,与交付的 xlsx 模板同结构) */
  document.getElementById('btnTpl').addEventListener('click', function(){
    if(typeof XLSX === 'undefined'){ alert('Excel 组件未加载,请检查网络后刷新。'); return; }
    // [分组, SKU名称, 目标到手价(C), 一口价(E), 国补方式(L), 立减%(M), 国补%(N), 券档位(O)]
    var defTiers = '68减3/118减5/198减10/298减20/498减30/698减50';
    var samples = [
      ['调料罐','SKU 1 · 标准款(正算)','',1000,'有',15,15,defTiers],
      ['调料罐','SKU 2 · 礼盒款(反推)',219,'','有',15,15,defTiers],
      ['保温杯','SKU 1 · 500ml(正算无国补)','',500,'无',15,15,defTiers],
      ['保温杯','SKU 2 · 反推演示(无国补)',200,'','无',15,15,defTiers]
    ];
    var TPL_HEADERS = ['商品分组','SKU名称','目标到手价(元)','售价(自动)','一口价(元)','到手价(自动)','取整一口价(可手填)','超级立减(自动)','优惠券(自动)','国补(自动)','折扣(自动)','国补方式(有/无)','立减%(默认15)','国补%(默认15)','券档位(选填)','成本(元)','毛利率(自动)','退款率(%)','净毛利率(自动)','固定成本(元)','工资(%)','税点(%)','佣金/服务费(%)','运费','运费方式(元/%)'];
    var aoa = [TPL_HEADERS];
    for(var i=0;i<50;i++){
      var s = samples[i] || ['','','','','','','',''];
      aoa.push([s[0],s[1],s[2],'',s[3],'','','','','','',s[4],s[5],s[6],s[7],'','','','','','','','','','元']);
    }
    var ws = XLSX.utils.aoa_to_sheet(aoa);
    ws['!cols'] = [{wch:14},{wch:24},{wch:17},{wch:11},{wch:13},{wch:12},{wch:18},{wch:13},{wch:11},{wch:11},{wch:10},{wch:13},{wch:12},{wch:12},{wch:30},{wch:11},{wch:11},{wch:11},{wch:12},{wch:12},{wch:10},{wch:10},{wch:13},{wch:10},{wch:13}];

    // ---- 反推辅助表(隐藏):逐券档不动点迭代,反推目标到手价→取整一口价 ----
    var CANDS = [0,3,5,10,20,30,50], BSTART = 3, BCOLS = 12;  // 0-based 列号
    function ecol(c){ return XLSX.utils.encode_col(c); }
    function dfnF(x, rate){ return 'IF('+x+'>100,CEILING('+x+'*'+rate+',1),IF('+x+'>10,CEILING('+x+'*'+rate+',0.1),ROUND('+x+'*'+rate+',2)))'; }
    function cpnF(x){ return 'IF('+x+'>=698,50,IF('+x+'>=498,30,IF('+x+'>=298,20,IF('+x+'>=198,10,IF('+x+'>=118,5,IF('+x+'>=68,3,0))))))'; }
    var wsH = {};
    for(var r=2; r<=51; r++){
      var MN = "'SKU录入模板'";
      function setH(col0, f){ wsH[XLSX.utils.encode_cell({r:r-1, c:col0})] = {t:'n', f:f}; }
      setH(0, 'IF('+MN+'!$C'+r+'="","",'+MN+'!$C'+r+')');
      setH(1, 'IF('+MN+'!$M'+r+'="",0.15,'+MN+'!$M'+r+'/100)');
      setH(2, 'IF('+MN+'!$L'+r+'="无",1,1-IF('+MN+'!$N'+r+'="",0.15,'+MN+'!$N'+r+'/100))');
      var guorate = 'IF('+MN+'!$N'+r+'="",0.15,'+MN+'!$N'+r+'/100)';
      for(var k=0;k<CANDS.length;k++){
        var cand = CANDS[k], c0 = BSTART + k*BCOLS;
        var S = []; for(var ii=0;ii<6;ii++) S.push('$'+ecol(c0+ii)+r);
        setH(c0, 'IF($A'+r+'="","",$A'+r+'/$C'+r+'+'+cand+')');
        for(var ii=1;ii<6;ii++) setH(c0+ii, 'IF($A'+r+'="","",$A'+r+'/$C'+r+'+'+dfnF(S[ii-1],'$B'+r)+'+'+cand+')');
        var Gg='$'+ecol(c0+6)+r, SG='$'+ecol(c0+7)+r, SU='$'+ecol(c0+8)+r, CP='$'+ecol(c0+9)+r, GU='$'+ecol(c0+10)+r, FN='$'+ecol(c0+11)+r;
        setH(c0+6, 'IF($A'+r+'="","",INT('+S[5]+'*2))');
        setH(c0+7, 'IF($A'+r+'="","",'+Gg+'*0.5)');
        setH(c0+8, 'IF($A'+r+'="","",'+dfnF(SG,'$B'+r)+')');
        setH(c0+9, 'IF($A'+r+'="","",'+cpnF(SG)+')');
        setH(c0+10, 'IF($A'+r+'="","",IF('+MN+'!$L'+r+'="无",0,ROUND(('+SG+'-'+SU+'-'+CP+')*'+guorate+',2)))');
        setH(c0+11, 'IF($A'+r+'="","",ROUND('+SG+'-'+SU+'-'+CP+'-'+GU+',2))');
      }
      var sum0 = BSTART + CANDS.length*BCOLS;  // err 区起始(0-based)
      for(var k=0;k<CANDS.length;k++){
        var cand = CANDS[k], b0 = BSTART + k*BCOLS;
        var CPb = '$'+ecol(b0+9)+r, FNb = '$'+ecol(b0+11)+r, Gb = '$'+ecol(b0+6)+r;
        setH(sum0+k,      'IF($A'+r+'="","",IF('+CPb+'='+cand+',IF('+FNb+'<=$A'+r+'+0.001,100000-'+FNb+',200000+ABS('+FNb+'-$A'+r+')),999999))');
        setH(sum0+7+k,    'IF($A'+r+'="","",'+Gb+')');
        setH(sum0+14+k,   'IF($A'+r+'="","",'+FNb+')');
      }
      var cBest = sum0+21, cIdx = sum0+22, cG = sum0+23, cFin = sum0+24;
      var eR = '$'+ecol(sum0)+r+':$'+ecol(sum0+6)+r;
      var gR = '$'+ecol(sum0+7)+r+':$'+ecol(sum0+13)+r;
      var fR = '$'+ecol(sum0+14)+r+':$'+ecol(sum0+20)+r;
      setH(cBest, 'IF($A'+r+'="","",MIN('+eR+'))');
      setH(cIdx,  'IF($A'+r+'="","",MATCH($'+ecol(cBest)+r+','+eR+',0))');
      setH(cG,    'IF($A'+r+'="","",INDEX('+gR+',$'+ecol(cIdx)+r+'))');
      setH(cFin,  'IF($A'+r+'="","",INDEX('+fR+',$'+ecol(cIdx)+r+'))');
    }
    var GBEST_COL = ecol(BSTART + CANDS.length*BCOLS + 23);
    wsH['!ref'] = 'A1:'+ecol(BSTART + CANDS.length*BCOLS + 24)+'51';

    // 列位:C=目标到手价 D=售价 E=一口价 F=到手价 G=取整一口价 H=超级立减 I=优惠券 J=国补 K=折扣
    //       L=国补方式 M=立减% N=国补% O=券档位;G 列:有一口价→INT(一口价),否则→反推辅助表
    for(var r=2; r<=51; r++){
      var D='D'+r, E='E'+r, F='F'+r, G='G'+r, H='H'+r, I='I'+r, J='J'+r, K='K'+r, L='L'+r, M='M'+r, N='N'+r;
      var rM = 'IF($'+M+'="",15,$'+M+')', rN = 'IF($'+N+'="",15,$'+N+')';
      ws[G] = {t:'n', f:'IF($'+E+'<>"",INT($'+E+'),IF($C'+r+'="","",IF(\'反推辅助\'!$'+GBEST_COL+r+'="","",\'反推辅助\'!$'+GBEST_COL+r+')))'};
      ws[D] = {t:'n', f:'IF($'+G+'="","",$'+G+'*0.5)'};
      ws[H] = {t:'n', f:'IF($'+D+'="","",IF($'+D+'>100,CEILING($'+D+'*'+rM+'/100,1),IF($'+D+'>10,CEILING($'+D+'*'+rM+'/100,0.1),ROUND($'+D+'*'+rM+'/100,2))))'};
      ws[I] = {t:'n', f:'IF($'+D+'="","",IF($'+D+'>=698,50,IF($'+D+'>=498,30,IF($'+D+'>=298,20,IF($'+D+'>=198,10,IF($'+D+'>=118,5,IF($'+D+'>=68,3,0)))))))'};
      ws[J] = {t:'n', f:'IF($'+D+'="","",IF($'+L+'="无",0,ROUND(($'+D+'-$'+H+'-$'+I+')*'+rN+'/100,2)))'};
      ws[F] = {t:'n', f:'IF($'+D+'="","",ROUND($'+D+'-$'+H+'-$'+I+'-$'+J+',2))'};
      ws[K] = {t:'s', f:'IF(OR($'+D+'="",$'+G+'=0),"",ROUND($'+F+'/$'+G+'*10,2)&"折")'};
      // 商家到手基数 = 到手价+国补 = 售价−立减−券(无国补时 J=0,即等于到手价)
      var B = '($F'+r+'+$J'+r+')';
      ws['Q'+r] = {t:'n', f:'IF(OR($F'+r+'="",$P'+r+'=""),"",('+B+'-$P'+r+')/'+B+')', z:'0.00%'};
      // 净毛利率 = 毛利率 − 国补÷商家到手(无国补 J=0) − 退款率% − 固定成本÷商家到手 − 工资% − 税点% − 佣金% − 运费(元÷商家到手、%按点数)
      ws['S'+r] = {t:'n', f:'IF(OR($F'+r+'="",$Q'+r+'=""),"",$Q'+r+'-IF($J'+r+'="",0,$J'+r+'/'+B+')-IF($R'+r+'="",0,$R'+r+'/100)-IF($T'+r+'="",0,$T'+r+'/'+B+')-IF($U'+r+'="",0,$U'+r+'/100)-IF($V'+r+'="",0,$V'+r+'/100)-IF($W'+r+'="",0,$W'+r+'/100)-IF($X'+r+'="",0,IF($Y'+r+'="%",$X'+r+'/100,$X'+r+'/'+B+')))', z:'0.00%'};
    }
    // 示例行缓存值(用页面计算逻辑预填,打开即见数)
    function cv(ref, v){ ws[ref] = {t:'n', f:ws[ref].f, v:v}; }
    function kv(ref, v){ ws[ref] = {t:'s', f:ws[ref].f, v:v}; }
    var f2 = forward(1000, groupParams({guobu:true}));
    cv('G2',f2.lp); cv('D2',f2.saleCents/100); cv('H2',f2.supVal/100); cv('I2',f2.c/100); cv('J2',f2.guo/100); cv('F2',f2.fin/100); kv('K2',f2.zhe.toFixed(2)+'折');
    var r3 = reverse(219, groupParams({guobu:true}));
    cv('G3',r3.f.lp); cv('D3',r3.f.saleCents/100); cv('H3',r3.f.supVal/100); cv('I3',r3.f.c/100); cv('J3',r3.f.guo/100); cv('F3',r3.f.fin/100); kv('K3',r3.f.zhe.toFixed(2)+'折');
    var f4 = forward(500, groupParams({guobu:false}));
    cv('G4',f4.lp); cv('D4',f4.saleCents/100); cv('H4',f4.supVal/100); cv('I4',f4.c/100); cv('J4',0); cv('F4',f4.fin/100); kv('K4',f4.zhe.toFixed(2)+'折');
    var r5 = reverse(200, groupParams({guobu:false}));
    cv('G5',r5.f.lp); cv('D5',r5.f.saleCents/100); cv('H5',r5.f.supVal/100); cv('I5',r5.f.c/100); cv('J5',0); cv('F5',r5.f.fin/100); kv('K5',r5.f.zhe.toFixed(2)+'折');

    var noteAoa = [
      ['SKU 优惠计算器 · 填写说明'],[''],
      ['一、两种用法(只需填蓝色字体列,其余自动计算):'],
      ['    【正算】填一口价(E列)→ 自动算售价、立减、券、国补、到手价、折扣。'],
      ['    【反推】只填目标到手价(C列)、一口价留空 → Excel 自动反推出取整一口价、售价及各项优惠,'],
      ['           保证到手价不高于目标(取最接近且不超目标的整数一口价)。反推由隐藏表「反推辅助」完成,请勿删除。'],
      ['    两列都填时以一口价(正算)为准。'],
      [''],
      ['二、各列说明:'],
      ['    1. 商品分组:相同分组名的行归为同一组。'],
      ['    2. SKU名称:规格/型号,随意填写。'],
      ['    3. 目标到手价(元):反推用,填它且一口价留空即自动反推。'],
      ['    4. 一口价(元):正算用;反推成功后如需微调可直接填入,会覆盖反推值。'],
      ['    5. 取整一口价:默认自动(一口价去小数 / 反推结果),也可手填整数覆盖。'],
      ['    6. 国补方式(有/无):填"无"不扣国补,到手价=售价−立减−券;留空按"有"。'],
      ['    7. 立减% / 国补%(选填):留空默认 15;Excel 内自动列按此比例重算。'],
      ['    8. 券档位(选填):格式 68减3/118减5/198减10;留空用默认6档(网页导入时识别)。'],
      [''],
      ['三、自动列逻辑:'],
      ['    售价 = 取整一口价 × 50%'],
      ['    超级立减 = 售价 × 立减%(默认15%;售价>100元进位到元;10~100元进位到角;≤10元保留分)'],
      ['    优惠券按售价就高:满68减3 / 满118减5 / 满198减10 / 满298减20 / 满498减30 / 满698减50'],
      ['    国补 =(售价 − 立减 − 券)× 国补%(默认15%);到手价 = 售价 − 立减 − 券 − 国补'],
      ['    毛利/净毛利基数 = 商家到手 = 售价 − 立减 − 券(有国补时 = 到手价+国补;无国补时 = 到手价)'],
      ['    毛利率 =(商家到手−成本)÷商家到手;净毛利率 = 毛利率 − 国补÷商家到手(仅有国补) − 退款率% − 固定成本÷商家到手 − 工资% − 税点% − 佣金% − 运费(元按÷商家到手、%按点数);无国补时国补为0、不影响'],
      [''],
      ['四、第 2~5 行为示例(含两行反推演示),正式使用可删除或覆盖;一行一个 SKU。']
    ];
    var ws2 = XLSX.utils.aoa_to_sheet(noteAoa);
    ws2['!cols'] = [{wch:95}];
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'SKU录入模板');
    XLSX.utils.book_append_sheet(wb, wsH, '反推辅助');
    XLSX.utils.book_append_sheet(wb, ws2, '填写说明');
    XLSX.utils.book_set_sheet_visibility(wb, '反推辅助', 1);
    XLSX.writeFile(wb, 'SKU优惠计算器_导入模板.xlsx');
  });

  function addGroup(){
    var sku = Object.assign({id:uid(), name:'SKU 1', lp:null, target:null}, costDefaults());
    groups.unshift({id:uid(), name:'新分组 '+(groups.length+1), skus:[sku], collapsed:false});   // 新分组插到最上面,便于立即编辑
    searchInput.value = ''; searchKw = ''; searchClear.style.display = 'none';
    renderAll();
  }
  document.getElementById('btnAddGroup').addEventListener('click', addGroup);
  document.getElementById('btnAddGroup2').addEventListener('click', addGroup);

  // 顶部"全选":勾选/取消当前列表中渲染的全部分组(查看已隐藏时含已隐藏分组)
  document.getElementById('chkAllVisible').addEventListener('change', function(e){
    renderedGroups().forEach(function(g){ g.sel = e.target.checked; });
    renderAll();
  });
  // 批量按钮:非批量模式→进入批量选择(显示勾选框/全选框,清除残留勾选);批量模式→执行批量切换并退出
  document.getElementById('btnBatchHide').addEventListener('click', function(){
    if(!batchMode){
      groups.forEach(function(g){ g.sel = false; });
      batchMode = true;
      renderAll();
    } else {
      var targets = renderedGroups().filter(function(g){ return g.sel; });
      if(!targets.length){ return; }
      targets.forEach(function(g){ g.hidden = !g.hidden; g.sel = false; });
      batchMode = false;
      renderAll();
    }
  });
  // 取消:退出批量选择模式,清除勾选
  document.getElementById('btnBatchCancel').addEventListener('click', function(){
    groups.forEach(function(g){ g.sel = false; });
    batchMode = false;
    renderAll();
  });
  // 查看已隐藏:切换是否在列表中同时显示已隐藏分组(淡化展示)
  document.getElementById('btnViewHidden').addEventListener('click', function(){
    showHidden = !showHidden;
    renderAll();
  });

  renderAll();
})();
</script>
